name: Publish Docker image to GHCR

# Build the Pausarr image and push it to the GitHub Container Registry
# (ghcr.io). Authentication uses the automatic GITHUB_TOKEN — there are no
# secrets to configure.
on:
  push:
    branches:
      - main
    tags:
      - "v*" # e.g. v1.2.3 — produces semver-tagged images
  # Allow publishing on demand from the Actions tab.
  workflow_dispatch:

env:
  # Registry and image name. IMAGE_NAME resolves to "owner/repo" (lowercased by
  # the metadata step below), so the image is ghcr.io/<owner>/pausarr.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # Required to read the repo and to push packages to GHCR.
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx enable multi-architecture builds (amd64 for typical
      # servers, arm64 for NAS/Raspberry-Pi-class hosts).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags and OCI labels from the Git ref/event.
      #   - pushes to main            -> :main and :latest
      #   - a tag like v1.2.3         -> :1.2.3, :1.2, :latest
      #   - every build               -> :sha-<short-sha>
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Don't push for pull-request-triggered runs (none configured here,
          # but keeps the action safe if triggers are added later).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Speed up repeat builds via the GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
