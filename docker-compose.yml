services:
  pausarr:
    build: .
    # Or use a prebuilt image once you publish one:
    # image: ghcr.io/ragepeanut/pausarr:latest
    container_name: pausarr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- qBittorrent Web UI connection ---
      QBITTORRENT_URL: "http://qbittorrent:8080"
      # Username/password are OPTIONAL. Leave them commented out if qBittorrent
      # is set to "Bypass authentication for clients on localhost / in
      # whitelisted IP subnets" for Pausarr's network. Otherwise set both.
      # QBITTORRENT_USER: "admin"
      # QBITTORRENT_PASS: "adminadmin"

      # --- Behaviour ---
      # A heartbeat tag stays active until this many seconds pass with no ping.
      # Send heartbeats more often than this (e.g. every 60s for a 180s window).
      HEARTBEAT_TIMEOUT: "180"
      # How often the watchdog expires stale heartbeats and reconciles.
      POLL_INTERVAL: "15"
      # Persisted flag state (keep on the mounted volume below).
      STATE_FILE: "/data/state.json"
      LOG_LEVEL: "INFO"
    volumes:
      - ./data:/data
    # If qBittorrent is in the same compose project, uncomment:
    # networks:
    #   - media
# networks:
#   media:
#     external: true
